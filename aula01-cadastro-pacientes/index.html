<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Pacientes</title>

  <!-- Bootstrap via CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="container py-5">
    <h1 class="mb-4">Cadastro de Pacientes</h1>

    <!-- Formulário de cadastro -->
    <form id="form-paciente" class="row g-3 mb-4">
      <div class="col-md-3">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" required>
      </div>

      <div class="col-md-3">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" required>
      </div>

      <div class="col-md-3">
        <label for="telefone" class="form-label">Telefone</label>
        <input type="tel" class="form-control" id="telefone" placeholder="(14) 99999-9999" required>
      </div>

      <div class="col-md-2">
        <label for="nascimento" class="form-label">Data de nascimento</label>
        <input type="date" class="form-control" id="nascimento" required>
      </div>

      <div class="col-md-1 d-flex align-items-end">
        <button type="submit" class="btn btn-primary w-100">+</button>
      </div>
    </form>

    <!-- Cabeçalho da seção de listagem -->
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h4 m-0">Pacientes cadastrados</h2>
      <!-- Contador de Pacientes -->
      <span id="total-pacientes" class="badge bg-secondary fs-6">Total de pacientes: 0</span>
    </div>

    <!-- Campo de Busca em Tempo Real -->
    <div class="row mb-3">
      <div class="col-md-4">
        <input type="text" id="campo-busca" class="form-control" placeholder="🔍 Buscar paciente por nome...">
      </div>
    </div>

    <!-- Tabela de pacientes -->
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <!-- Clique no Nome para ordenar -->
          <th id="th-nome" style="cursor: pointer;" title="Clique para ordenar por nome">
            Nome ↕️
          </th>
          <th>E-mail</th>
          <th>Telefone</th>
          <th>Data de nascimento</th>
          <th>Idade</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-pacientes">
        <!-- Linhas geradas dinamicamente via JavaScript -->
      </tbody>
    </table>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
